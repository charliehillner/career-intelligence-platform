services:
  postgres:
    image: postgres:16
    container_name: career-intelligence-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: career_intelligence
      POSTGRES_USER: career_user
      POSTGRES_PASSWORD: career_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_user -d career_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
